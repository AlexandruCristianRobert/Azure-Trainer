name: Deploy Azure-Trainer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused Data checks
        run: npm test -- tests/data-python-sdk.test.js tests/data-capstone-core.test.js
      - name: Run focused Messaging checks
        run: npm run test:messaging
      - name: Run focused Security and Observability checks
        run: npm run test:security-observability
      - name: Run focused HTTP Functions checks
        run: npm run test:http-functions
      - name: Build for project Pages path
        run: npm run build -- --base=/Azure-Trainer/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
